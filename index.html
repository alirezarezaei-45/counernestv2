<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<title>Counter Nestv2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{border-radius:4px;background:#3a3020}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5)}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid #fff}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useContext,createContext}=React;
const SK="counternest_v5";

// ── Theme / Color ──────────────────────────────────────────────────────────
const THEMES={
  amber:{name:"Amber",accent:"#d4820a",accentL:"#f0a832",accentDim:"rgba(212,130,10,0.15)",textOnAccent:"#0f0e0c"},
  blue:{name:"Blue",accent:"#2563eb",accentL:"#60a5fa",accentDim:"rgba(37,99,235,0.15)",textOnAccent:"#fff"},
  green:{name:"Green",accent:"#059669",accentL:"#34d399",accentDim:"rgba(5,150,105,0.15)",textOnAccent:"#fff"},
  purple:{name:"Purple",accent:"#7c3aed",accentL:"#a78bfa",accentDim:"rgba(124,58,237,0.15)",textOnAccent:"#fff"},
  gray:{name:"Gray",accent:"#6b7280",accentL:"#d1d5db",accentDim:"rgba(107,114,128,0.15)",textOnAccent:"#fff"},
};
const DARK={bg:"#0f0e0c",surface:"#1a1610",card:"#211d14",border:"#2e2618",text:"#f0e6d3",textSub:"#c8b48a",textMuted:"#8a7055",textFaint:"#6b5a3e"};
const LIGHT={bg:"#f5f0e8",surface:"#ffffff",card:"#faf6ef",border:"#e0d5c0",text:"#1a1208",textSub:"#4a3820",textMuted:"#7a6040",textFaint:"#a08060"};
const LINE_COLORS=["#d4820a","#2563eb","#059669","#d4537e","#7c3aed","#0891b2","#d85a30","#84cc16"];

// ── Helpers ────────────────────────────────────────────────────────────────
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const ts=()=>new Date().toISOString();
const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}catch{return iso}};
const fmtDT=iso=>{try{return new Date(iso).toLocaleString()}catch{return iso}};
const fmtSW=ms=>{const cs=Math.floor((ms%1000)/10),s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000)%60,h=Math.floor(ms/3600000);return h>0?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(cs).padStart(2,"0")}`};
const fmtDur=ms=>{const s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000)%60,h=Math.floor(ms/3600000);return h>0?`${h}h ${m}m`:m>0?`${m}m ${s}s`:`${s}s`};

function loadData(){
  try{const d=localStorage.getItem(SK);return d?JSON.parse(d):{folders:[],cards:[],settings:{dark:true,theme:"amber",fontSize:14}}}
  catch{return{folders:[],cards:[],settings:{dark:true,theme:"amber",fontSize:14}}}
}
function saveData(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch{}}

// ── CSV Export (Excel-safe) ────────────────────────────────────────────────
function toCSV(rows){
  // sep=, tells Excel which delimiter to use regardless of locale
  const header="sep=,\n";
  const body=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  return header+body;
}
function downloadCSV(filename,rows){
  // \uFEFF BOM so Excel opens UTF-8 correctly
  const blob=new Blob(["\uFEFF"+toCSV(rows)],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
}

function rangeFilter(history,range,cf,ct){
  if(!history||!history.length)return[];
  if(range==="all")return history;
  if(range==="custom"){
    const f=new Date(cf),t=new Date(ct);t.setHours(23,59,59,999);
    return history.filter(h=>{const d=new Date(h.at);return d>=f&&d<=t});
  }
  const now=new Date(),from=new Date();
  ({week:()=>from.setDate(now.getDate()-7),month:()=>from.setMonth(now.getMonth()-1),"3months":()=>from.setMonth(now.getMonth()-3),year:()=>from.setFullYear(now.getFullYear()-1)}[range]||(() => {}))();
  return history.filter(h=>new Date(h.at)>=from);
}

function exportCard(card,folderName,range,cf,ct){
  const rows=[["Folder","Card","Counter","Value","Change","Timestamp","Action"]];
  card.counters.forEach(co=>rangeFilter(co.history||[],range,cf,ct).forEach(h=>
    rows.push([folderName||"(none)",card.name,co.name,h.value,h.delta??0,h.at,h.action])));
  (card.stopwatchSessions||[]).forEach(s=>
    rows.push([folderName||"(none)",card.name,"[Stopwatch]",fmtDur(s.duration),"",s.at,"session"]));
  downloadCSV(`${card.name.replace(/\W+/g,"_")}.csv`,rows);
}
function exportFolder(folder,cards,range,cf,ct){
  const rows=[["Folder","Card","Counter","Value","Change","Timestamp","Action"]];
  cards.filter(c=>c.folderId===folder.id).forEach(card=>{
    card.counters.forEach(co=>rangeFilter(co.history||[],range,cf,ct).forEach(h=>
      rows.push([folder.name,card.name,co.name,h.value,h.delta??0,h.at,h.action])));
    (card.stopwatchSessions||[]).forEach(s=>
      rows.push([folder.name,card.name,"[Stopwatch]",fmtDur(s.duration),"",s.at,"session"]));
  });
  downloadCSV(`${folder.name.replace(/\W+/g,"_")}_folder.csv`,rows);
}

// ── Graph helpers ──────────────────────────────────────────────────────────
const BUCKET_MS={"30min":30*60000,"2hr":2*3600000,"12hr":12*3600000,"daily":86400000};
function aggregate(history,bucket){
  if(!history||history.length<2)return history||[];
  const bms=BUCKET_MS[bucket]||86400000;
  const sorted=[...history].sort((a,b)=>new Date(a.at)-new Date(b.at));
  const map={};
  sorted.forEach(h=>{const bk=Math.floor(new Date(h.at).getTime()/bms)*bms;map[bk]=h.value});
  return Object.keys(map).sort((a,b)=>+a-+b).map(k=>({at:new Date(+k).toISOString(),value:map[k]}));
}
function smoothPath(pts){
  if(!pts.length)return "";
  if(pts.length===1)return `M${pts[0].x},${pts[0].y}`;
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    d+=` C${p1.x+(p2.x-p0.x)/6},${p1.y+(p2.y-p0.y)/6},${p2.x-(p3.x-p1.x)/6},${p2.y-(p3.y-p1.y)/6},${p2.x},${p2.y}`;
  }
  return d;
}

// Build series array for graph — works for both card-level and folder-level
function buildSeries(card,allCards,folderId){
  // folder mode: folderId provided, allCards used
  // card mode: single card
  const sources=folderId!=null
    ?(allCards||[]).filter(c=>c.folderId===folderId).flatMap(c=>c.counters.map(co=>({label:`${c.name} · ${co.name}`,co})))
    :(card?.counters||[]).map(co=>({label:co.name,co}));
  return sources.map(({label,co},i)=>({
    label,
    color:LINE_COLORS[i%LINE_COLORS.length],
    raw:co.history||[],
  }));
}

// ── Context ────────────────────────────────────────────────────────────────
const Ctx=createContext(null);
const useA=()=>useContext(Ctx);

// ── Icons ──────────────────────────────────────────────────────────────────
const Ico={
  trash:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>,
  edit:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  move:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>,
  graph:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
  sw:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  export:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>,
  settings:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>,
  close:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  dots:<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>,
  plus:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  folder:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>,
  history:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 101.85-5.76L1 10"/></svg>,
  reset:<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 101.85-5.76L1 10"/></svg>,
};

// ── Primitives ─────────────────────────────────────────────────────────────
function Btn({children,onClick,primary,danger,full,style={}}){
  const {C,T}=useA();
  const fs=useFS();
  return <button onClick={onClick} style={{padding:`${fs*0.57}px ${fs*1.2}px`,borderRadius:10,fontSize:fs*0.93,fontWeight:600,background:primary?T.accent:danger?"#5a1a1a":"transparent",border:`1.5px solid ${primary?T.accent:danger?"#8a2a2a":C.border}`,color:primary?T.textOnAccent:danger?"#e05a5a":C.textSub,width:full?"100%":"auto",...style}}>{children}</button>;
}

function TInput({value,onChange,placeholder,onKeyDown,autoFocus,type="text"}){
  const {C}=useA();const fs=useFS();
  const r=useRef();
  useEffect(()=>{if(autoFocus&&r.current)setTimeout(()=>r.current?.focus(),80)},[autoFocus]);
  return <input ref={r} type={type} value={value} onChange={onChange} placeholder={placeholder} onKeyDown={onKeyDown}
    style={{width:"100%",background:C.card,border:`1.5px solid ${C.border}`,borderRadius:10,padding:`${fs*0.7}px ${fs*0.9}px`,color:C.text,fontSize:fs,outline:"none",marginBottom:fs*0.8,boxSizing:"border-box"}}/>;
}

function Toggle({value,onChange}){
  const {T}=useA();
  return <div onClick={onChange} style={{width:48,height:26,borderRadius:13,background:value?T.accent:"#444",cursor:"pointer",position:"relative",transition:"background 0.2s",flexShrink:0}}>
    <div style={{position:"absolute",top:3,left:value?25:3,width:20,height:20,borderRadius:10,background:"#fff",transition:"left 0.2s",boxShadow:"0 1px 4px rgba(0,0,0,0.4)"}}/>
  </div>;
}

function useFS(){const {data}=useA();return data?.settings?.fontSize||14;}

function Overlay({children,onClose,sheet}){
  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.72)",zIndex:300,display:"flex",alignItems:sheet?"flex-end":"center",justifyContent:"center",padding:sheet?0:16,animation:"fadeIn 0.15s ease"}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{width:sheet?"100%":"auto",animation:sheet?"slideUp 0.22s ease":"none"}}>{children}</div>
  </div>;
}

function ModalBox({title,children,onClose}){
  const {C}=useA();const fs=useFS();
  return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:16,padding:`${fs*1.2}px ${fs*1.4}px`,width:"min(400px,94vw)",boxShadow:"0 24px 64px rgba(0,0,0,0.5)",maxHeight:"88vh",overflowY:"auto"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:fs}}>
      <span style={{fontSize:fs*1.1,fontWeight:700,color:C.text}}>{title}</span>
      <button onClick={onClose} style={{background:"transparent",border:"none",color:C.textMuted,cursor:"pointer",display:"flex",padding:4}}>{Ico.close}</button>
    </div>
    {children}
  </div>;
}

function SheetBox({title,children,onClose}){
  const {C}=useA();const fs=useFS();
  return <div style={{background:C.surface,borderRadius:"20px 20px 0 0",padding:`16px ${fs*1.2}px ${Math.max(36,fs*2)}px`,width:"100%",maxHeight:"82vh",overflowY:"auto"}}>
    <div style={{width:36,height:4,borderRadius:2,background:C.border,margin:"0 auto 14px"}}/>
    {title&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:fs}}>
      <span style={{fontSize:fs*1.05,fontWeight:700,color:C.text}}>{title}</span>
      <button onClick={onClose} style={{background:"transparent",border:"none",color:C.textMuted,cursor:"pointer",display:"flex",padding:4}}>{Ico.close}</button>
    </div>}
    {children}
  </div>;
}

// ── Graph Component ────────────────────────────────────────────────────────
function Graph({series,title}){
  const {C}=useA();const fs=useFS();
  const [bucket,setBucket]=useState("daily");
  const [hover,setHover]=useState(null);
  const [hiddenIds,setHiddenIds]=useState([]);

  const W=Math.min(360,window.innerWidth-60);
  const H=200;
  const PAD={t:16,r:14,b:44,l:46};
  const gW=W-PAD.l-PAD.r,gH=H-PAD.t-PAD.b;

  const activeSeries=series.filter(s=>!hiddenIds.includes(s.label)).map(s=>({
    ...s,
    pts:aggregate(s.raw,bucket),
  })).filter(s=>s.pts.length>=2);

  const allTimes=activeSeries.flatMap(s=>s.pts.map(p=>new Date(p.at).getTime()));
  const allVals=activeSeries.flatMap(s=>s.pts.map(p=>p.value));

  if(allTimes.length===0) return(
    <div>
      <div style={{display:"flex",gap:4,marginBottom:10,flexWrap:"wrap"}}>
        {["30min","2hr","12hr","daily"].map(b=>(
          <BucketBtn key={b} b={b} active={bucket===b} onClick={()=>setBucket(b)}/>
        ))}
      </div>
      <p style={{fontSize:fs*0.85,color:C.textFaint,textAlign:"center",padding:24}}>Not enough data yet — log more values to see the graph.</p>
    </div>
  );

  const minT=Math.min(...allTimes),maxT=Math.max(...allTimes),rangeT=maxT-minT||1;
  const minV=Math.min(...allVals),maxV=Math.max(...allVals),rangeV=maxV-minV||1;
  const pad=rangeV*0.1;
  const lo=minV-pad,hi=maxV+pad,rv=hi-lo;

  const xp=t=>PAD.l+(t-minT)/rangeT*gW;
  const yp=v=>PAD.t+(1-(v-lo)/rv)*gH;

  const nXLabels=Math.min(5,allTimes.length);
  const xLabels=Array.from({length:nXLabels},(_,i)=>minT+i*(rangeT/(nXLabels-1||1)));
  const ySteps=4;
  const yLabels=Array.from({length:ySteps},(_,i)=>lo+i*(rv/(ySteps-1)));

  return(
    <div>
      {/* Bucket toggle */}
      <div style={{display:"flex",gap:4,marginBottom:10}}>
        {["30min","2hr","12hr","daily"].map(b=><BucketBtn key={b} b={b} active={bucket===b} onClick={()=>setBucket(b)}/>)}
      </div>
      {/* Legend */}
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
        {series.map(s=>(
          <button key={s.label} onClick={()=>setHiddenIds(p=>p.includes(s.label)?p.filter(x=>x!==s.label):[...p,s.label])}
            style={{display:"flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:20,fontSize:Math.max(10,fs*0.78),cursor:"pointer",border:`1.5px solid ${s.color}`,background:hiddenIds.includes(s.label)?"transparent":s.color+"33",color:hiddenIds.includes(s.label)?C.textFaint:s.color,fontWeight:600,opacity:hiddenIds.includes(s.label)?0.5:1}}>
            <span style={{width:8,height:8,borderRadius:4,background:hiddenIds.includes(s.label)?"transparent":s.color,border:`1.5px solid ${s.color}`,display:"inline-block"}}/>
            {s.label}
          </button>
        ))}
      </div>
      {/* SVG Chart */}
      <div style={{overflowX:"auto"}}>
      <svg width={W} height={H} style={{display:"block",margin:"0 auto",overflow:"visible"}}>
        {/* Grid lines */}
        {yLabels.map((v,i)=>(
          <g key={i}>
            <line x1={PAD.l} x2={PAD.l+gW} y1={yp(v)} y2={yp(v)} stroke={C.border} strokeWidth="0.6"/>
            <text x={PAD.l-6} y={yp(v)+4} textAnchor="end" fill={C.textFaint} fontSize={9}>{Math.round(v)}</text>
          </g>
        ))}
        {/* X labels */}
        {xLabels.map((t,i)=>(
          <text key={i} x={xp(t)} y={H-5} textAnchor="middle" fill={C.textFaint} fontSize={9}>{fmtDate(new Date(t).toISOString())}</text>
        ))}
        {/* Lines */}
        {activeSeries.map(s=>{
          const mapped=s.pts.map(p=>({x:xp(new Date(p.at).getTime()),y:yp(p.value),v:p.value,at:p.at}));
          return(
            <g key={s.label}>
              {/* Gradient area under line */}
              <defs>
                <linearGradient id={`grad_${s.label.replace(/\W/g,"_")}`} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={s.color} stopOpacity="0.15"/>
                  <stop offset="100%" stopColor={s.color} stopOpacity="0"/>
                </linearGradient>
              </defs>
              <path d={smoothPath(mapped)+" L"+mapped[mapped.length-1].x+","+(PAD.t+gH)+" L"+mapped[0].x+","+(PAD.t+gH)+" Z"}
                fill={`url(#grad_${s.label.replace(/\W/g,"_")})`}/>
              <path d={smoothPath(mapped)} fill="none" stroke={s.color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
              {mapped.map((p,i)=>(
                <circle key={i} cx={p.x} cy={p.y}
                  r={hover&&hover.label===s.label&&hover.i===i?6:3.5}
                  fill={s.color} stroke={C.surface} strokeWidth="1.5"
                  style={{cursor:"pointer",transition:"r 0.1s"}}
                  onMouseEnter={()=>setHover({label:s.label,i,x:p.x,y:p.y,v:p.v,at:p.at,color:s.color})}
                  onMouseLeave={()=>setHover(null)}/>
              ))}
            </g>
          );
        })}
        {/* Tooltip */}
        {hover&&(()=>{
          const tx=Math.min(hover.x+10,W-115);
          const ty=Math.max(hover.y-36,PAD.t);
          return(
            <g>
              <rect x={tx} y={ty} width={108} height={38} rx={6} fill={C.surface} stroke={C.border} strokeWidth="1"/>
              <circle cx={tx+10} cy={ty+12} r={4} fill={hover.color}/>

              <text x={tx+8} y={ty+30} fill={C.textMuted} fontSize={9}>{fmtDate(hover.at)} → {hover.v}</text>
            </g>
          );
        })()}

        <line x1={PAD.l} x2={PAD.l} y1={PAD.t} y2={PAD.t+gH} stroke={C.border} strokeWidth="1"/>

      </svg>
      </div>
    </div>
  );
}

// ── Stopwatch ──────────────────────────────────────────────────────────────
function Stopwatch({sessions,onLog}){
  const {C,T}=useA();const fs=useFS();
  const [running,setRunning]=useState(false);
  const [elapsed,setElapsed]=useState(0);
  const t0=useRef(null),iv=useRef(null);
  const start=()=>{t0.current=Date.now()-elapsed;iv.current=setInterval(()=>setElapsed(Date.now()-t0.current),50);setRunning(true)};
  const stop=()=>{clearInterval(iv.current);setRunning(false)};
  const reset=()=>{clearInterval(iv.current);setRunning(false);setElapsed(0)};
  const log=()=>{onLog(elapsed);reset()};
  useEffect(()=>()=>clearInterval(iv.current),[]);
  return(
    <div style={{background:C.bg,borderRadius:12,padding:"12px 14px",marginTop:8,border:`1px solid ${C.border}`}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:fs*1.4,fontFamily:"monospace",fontWeight:700,color:running?T.accentL:C.text,minWidth:100}}>{fmtSW(elapsed)}</span>
        <div style={{display:"flex",gap:6,marginLeft:"auto"}}>
          <button onClick={running?stop:start} style={{padding:"6px 14px",borderRadius:8,fontSize:fs*0.85,background:running?T.accentDim:T.accent,border:`1px solid ${T.accent}`,color:running?T.accentL:T.textOnAccent,fontWeight:700,cursor:"pointer"}}>{running?"Pause":"Start"}</button>
          <button onClick={reset} style={{padding:"6px 10px",borderRadius:8,fontSize:fs*0.85,background:"transparent",border:`1px solid ${C.border}`,color:C.textSub,cursor:"pointer"}}>Reset</button>
          {!running&&elapsed>0&&<button onClick={log} style={{padding:"6px 10px",borderRadius:8,fontSize:fs*0.85,background:"#1a2e1a",border:"none",color:"#4ade80",fontWeight:700,cursor:"pointer"}}>Log</button>}
        </div>
      </div>
      {(sessions||[]).length>0&&(
        <div style={{marginTop:8,maxHeight:80,overflowY:"auto"}}>
          {[...(sessions||[])].reverse().slice(0,5).map((s,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",borderTop:`1px solid ${C.border}`,fontSize:fs*0.8}}>
              <span style={{color:C.textMuted}}>{fmtDate(s.at)}</span>
              <span style={{color:T.accentL,fontWeight:600}}>{fmtDur(s.duration)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Counter Row ────────────────────────────────────────────────────────────
function CounterRow({co,cardId}){
  const {upd,C,T,open}=useA();const fs=useFS();
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState("");
  const inpRef=useRef();
  useEffect(()=>{if(editing&&inpRef.current){inpRef.current.focus();inpRef.current.select()}},[editing]);

  function change(delta){
    upd(d=>{
      const card=d.cards.find(x=>x.id===cardId);if(!card)return;
      const counter=card.counters.find(x=>x.id===co.id);if(!counter)return;
      counter.value+=delta;
      counter.history.push({value:counter.value,at:ts(),action:delta>0?"increment":"decrement",delta});
    });
  }
  function commit(){
    const v=parseFloat(val);
    if(!isNaN(v)){
      upd(d=>{
        const card=d.cards.find(x=>x.id===cardId);if(!card)return;
        const counter=card.counters.find(x=>x.id===co.id);if(!counter)return;
        const delta=v-counter.value;counter.value=v;
        counter.history.push({value:v,at:ts(),action:"manual",delta});
      });
    }
    setEditing(false);
  }
  function openMenu(){
    open("counterMenu",{co,cardId});
  }

  return(
    <div style={{display:"flex",alignItems:"center",gap:8,padding:`${fs*0.6}px 0`,borderBottom:`1px solid ${C.border}`}}>
      <span style={{flex:1,fontSize:fs*0.9,color:C.textSub,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{co.name}</span>
      <button onClick={()=>change(-1)} style={{width:fs*2.6,height:fs*2.6,borderRadius:8,background:C.card,border:`1.5px solid ${C.border}`,color:C.text,fontSize:fs*1.5,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>−</button>
      {editing?(
        <input ref={inpRef} value={val} onChange={e=>setVal(e.target.value)}
          onBlur={commit} onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape")setEditing(false)}}
          style={{width:fs*4,background:C.card,border:`1.5px solid ${T.accent}`,borderRadius:8,padding:"4px",color:C.text,fontSize:fs,fontWeight:700,textAlign:"center",outline:"none"}}/>
      ):(
        <span onClick={()=>{setVal(String(co.value));setEditing(true)}} title="Tap to type"
          style={{fontSize:fs*1.1,fontWeight:700,color:C.text,minWidth:fs*2.5,textAlign:"center",cursor:"text",padding:`2px ${fs*0.4}px`,borderRadius:6,border:`1px dashed ${C.border}`}}>{co.value}</span>
      )}
      <button onClick={()=>change(1)} style={{width:fs*2.6,height:fs*2.6,borderRadius:8,background:T.accent,border:"none",color:T.textOnAccent,fontSize:fs*1.5,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,flexShrink:0}}>+</button>
      <button onClick={openMenu} style={{width:fs*2,height:fs*2.6,background:"transparent",border:"none",color:C.textFaint,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{Ico.dots}</button>
    </div>
  );
}

// ── Card Block ─────────────────────────────────────────────────────────────
function CardBlock({card}){
  const {upd,C,T,open,data}=useA();const fs=useFS();
  const [expanded,setExpanded]=useState(false);
  const [adding,setAdding]=useState(false);
  const [newName,setNewName]=useState("");
  const [showSW,setShowSW]=useState(false);
  const [editingName,setEditingName]=useState(false);
  const [cardName,setCardName]=useState(card.name);
  const addRef=useRef(),nameRef=useRef();

  useEffect(()=>{if(adding&&addRef.current)addRef.current.focus()},[adding]);
  useEffect(()=>{if(editingName&&nameRef.current){nameRef.current.focus();nameRef.current.select()}},[editingName]);

  function addCounter(){
    if(!newName.trim())return;
    upd(d=>{const c=d.cards.find(x=>x.id===card.id);if(c)c.counters.push({id:uid(),name:newName.trim(),value:0,history:[{value:0,at:ts(),action:"created",delta:0}]})});
    setNewName("");setAdding(false);
  }
  function renameCard(){
    if(cardName.trim())upd(d=>{const c=d.cards.find(x=>x.id===card.id);if(c)c.name=cardName.trim()});
    setEditingName(false);
  }
  function logSW(ms){
    upd(d=>{const c=d.cards.find(x=>x.id===card.id);if(c){if(!c.stopwatchSessions)c.stopwatchSessions=[];c.stopwatchSessions.push({duration:ms,at:ts()})}});
  }

  const folder=data.folders.find(f=>f.id===card.folderId);

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,marginBottom:10}}>
      {/* Header */}
      <div style={{padding:`${fs*0.85}px ${fs}px`,display:"flex",alignItems:"center",gap:8}}>
        {/* Name — click to rename */}
        <div style={{flex:1,minWidth:0}} onClick={()=>!editingName&&setExpanded(p=>!p)}>
          {editingName?(
            <input ref={nameRef} value={cardName} onChange={e=>setCardName(e.target.value)}
              onClick={e=>e.stopPropagation()}
              onBlur={renameCard} onKeyDown={e=>{if(e.key==="Enter")renameCard();if(e.key==="Escape")setEditingName(false)}}
              style={{background:"transparent",border:"none",borderBottom:`2px solid ${T.accent}`,color:C.text,fontSize:fs*1.05,fontWeight:700,outline:"none",padding:"2px 0",width:"100%"}}/>
          ):(
            <div style={{display:"flex",alignItems:"baseline",gap:8,cursor:"pointer"}}>
              <span style={{fontSize:fs*1.05,fontWeight:700,color:C.text,cursor:"text",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}
                onClick={e=>{e.stopPropagation();setEditingName(true);setCardName(card.name)}}>{card.name}</span>
              <span style={{fontSize:fs*0.78,color:C.textFaint,whiteSpace:"nowrap"}}>{card.counters.length} counter{card.counters.length!==1?"s":""}</span>
            </div>
          )}
        </div>
        {/* Stopwatch */}
        <button onClick={()=>{setShowSW(p=>!p);if(!expanded)setExpanded(true)}}
          style={{width:fs*2.4,height:fs*2.4,borderRadius:8,background:showSW?T.accentDim:"transparent",border:`1px solid ${showSW?T.accent:C.border}`,color:showSW?T.accentL:C.textMuted,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
          {Ico.sw}
        </button>
        {/* 3-dot */}
        <button onClick={()=>open("cardMenu",{card,folder})}
          style={{width:fs*2.4,height:fs*2.4,borderRadius:8,background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
          {Ico.dots}
        </button>
        {/* Arrow */}
        <button onClick={()=>setExpanded(p=>!p)} style={{width:fs*1.8,height:fs*2.4,background:"transparent",border:"none",color:C.textFaint,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,transition:"transform 0.2s",transform:expanded?"rotate(90deg)":"rotate(0deg)"}}>▶</button>
      </div>

      {/* Body */}
      {expanded&&(
        <div style={{borderTop:`1px solid ${C.border}`,padding:`${fs*0.6}px ${fs}px ${fs}px`}}>
          {showSW&&<Stopwatch sessions={card.stopwatchSessions} onLog={logSW}/>}
          {card.counters.length===0&&!adding&&(
            <p style={{fontSize:fs*0.85,color:C.textFaint,textAlign:"center",padding:`${fs}px 0`}}>No counters yet</p>
          )}
          {card.counters.map(co=><CounterRow key={co.id} co={co} cardId={card.id}/>)}
          {adding?(
            <div style={{display:"flex",gap:8,marginTop:fs*0.7,alignItems:"center"}}>
              <input ref={addRef} value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Counter name…"
                onKeyDown={e=>{if(e.key==="Enter")addCounter();if(e.key==="Escape")setAdding(false)}}
                style={{flex:1,background:C.bg,border:`1.5px solid ${C.border}`,borderRadius:10,padding:`${fs*0.65}px ${fs*0.85}px`,color:C.text,fontSize:fs*0.93,outline:"none"}}/>
              <Btn primary onClick={addCounter} style={{padding:`${fs*0.5}px ${fs}px`,fontSize:fs*0.85}}>Add</Btn>
              <Btn onClick={()=>setAdding(false)} style={{padding:`${fs*0.5}px ${fs*0.8}px`,fontSize:fs*0.85}}>✕</Btn>
            </div>
          ):(
            <button onClick={()=>setAdding(true)}
              style={{marginTop:fs*0.7,background:"transparent",border:`1.5px dashed ${C.border}`,borderRadius:10,color:C.textFaint,fontSize:fs*0.9,padding:`${fs*0.65}px ${fs}px`,width:"100%",cursor:"pointer"}}
              onMouseOver={e=>e.currentTarget.style.borderColor=T.accent}
              onMouseOut={e=>e.currentTarget.style.borderColor=C.border}>+ Add Counter</button>
          )}
        </div>
      )}
    </div>
  );
}

// ── Popup layer (sheets, modals, menus) ────────────────────────────────────
function PopupLayer({popup,onClose}){
  const {C,T,data,upd}=useA();const fs=useFS();
  if(!popup)return null;
  const {type,payload}=popup;

  // Card 3-dot menu
  if(type==="cardMenu"){
    const {card,folder}=payload;
    const items=[
      {icon:Ico.graph,label:"Graph",action:()=>onClose()&&0||open("cardGraph",{card})},
      {icon:Ico.export,label:"Export CSV",action:()=>onClose()&&0||open("exportSheet",{type:"card",id:card.id})},
      {icon:Ico.move,label:"Move to folder",action:()=>onClose()&&0||open("moveCard",{cardId:card.id})},
      {icon:Ico.trash,label:"Delete card",danger:true,action:()=>onClose()&&0||open("confirm",{msg:`Delete "${card.name}" and all its counters?`,onYes:()=>upd(d=>{d.cards=d.cards.filter(c=>c.id!==card.id)})})},
    ];
    return(
      <Overlay onClose={onClose} sheet>
        <SheetBox title={card.name} onClose={onClose}>
          {items.map(({icon,label,action,danger})=>(
            <button key={label} onClick={action}
              style={{display:"flex",alignItems:"center",gap:fs,width:"100%",padding:`${fs*0.85}px ${fs*0.5}px`,background:"transparent",border:"none",borderBottom:`1px solid ${C.border}`,color:danger?"#e05a5a":C.textSub,fontSize:fs,textAlign:"left",cursor:"pointer"}}>
              <span style={{color:danger?"#e05a5a":C.textMuted,display:"flex",flexShrink:0}}>{icon}</span>{label}
            </button>
          ))}
        </SheetBox>
      </Overlay>
    );
  }

  // Counter ⋯ menu
  if(type==="counterMenu"){
    const {co,cardId}=payload;
    const resetFn=()=>upd(d=>{const card=d.cards.find(x=>x.id===cardId);if(!card)return;const counter=card.counters.find(x=>x.id===co.id);if(!counter)return;counter.value=0;counter.history.push({value:0,at:ts(),action:"reset",delta:0})});
    const deleteFn=()=>upd(d=>{const card=d.cards.find(x=>x.id===cardId);if(card)card.counters=card.counters.filter(x=>x.id!==co.id)});
    // get live counter
    const liveCard=data.cards.find(x=>x.id===cardId);
    const liveCo=liveCard?.counters.find(x=>x.id===co.id)||co;
    const items=[
      {icon:Ico.history,label:"View history",action:()=>onClose()&&0||open("counterHistory",{co:liveCo})},
      {icon:Ico.reset,label:"Reset to 0",action:()=>{resetFn();onClose()}},
      {icon:Ico.trash,label:"Delete counter",danger:true,action:()=>{onClose();open("confirm",{msg:`Delete "${co.name}" and all its history?`,onYes:deleteFn})}},
    ];
    return(
      <Overlay onClose={onClose} sheet>
        <SheetBox title={co.name} onClose={onClose}>
          {items.map(({icon,label,action,danger})=>(
            <button key={label} onClick={action}
              style={{display:"flex",alignItems:"center",gap:fs,width:"100%",padding:`${fs*0.85}px ${fs*0.5}px`,background:"transparent",border:"none",borderBottom:`1px solid ${C.border}`,color:danger?"#e05a5a":C.textSub,fontSize:fs,textAlign:"left",cursor:"pointer"}}>
              <span style={{color:danger?"#e05a5a":C.textMuted,display:"flex",flexShrink:0}}>{icon}</span>{label}
            </button>
          ))}
        </SheetBox>
      </Overlay>
    );
  }

  // Counter history
  if(type==="counterHistory"){
    const {co}=payload;
    // get live
    const hist=[...(co.history||[])].reverse();
    return(
      <Overlay onClose={onClose} sheet>
        <SheetBox title={`History — ${co.name}`} onClose={onClose}>
          <div style={{maxHeight:340,overflowY:"auto",marginBottom:fs}}>
            {hist.length===0&&<p style={{fontSize:fs*0.9,color:C.textFaint,textAlign:"center",padding:fs*1.5}}>No history yet</p>}
            {hist.map((h,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",padding:`${fs*0.6}px 0`,borderBottom:`1px solid ${C.border}`,alignItems:"center"}}>
                <div>
                  <span style={{fontSize:fs*0.9,color:C.textMuted,textTransform:"capitalize"}}>{h.action}</span>
                  <span style={{fontSize:fs*0.78,color:C.textFaint,marginLeft:8}}>{fmtDT(h.at)}</span>
                </div>
                <span style={{fontSize:fs*1.05,fontWeight:700,color:C.text}}>{h.value}</span>
              </div>
            ))}
          </div>
          <Btn full onClick={onClose}>Close</Btn>
        </SheetBox>
      </Overlay>
    );
  }

  // Card graph
  if(type==="cardGraph"){
    const {card}=payload;
    // get live card
    const liveCard=data.cards.find(x=>x.id===card.id)||card;
    const series=buildSeries(liveCard,null,null);
    return(
      <Overlay onClose={onClose} sheet>
        <SheetBox title={`Graph — ${liveCard.name}`} onClose={onClose}>
          <Graph series={series}/>
          <div style={{marginTop:fs}}><Btn full onClick={onClose}>Close</Btn></div>
        </SheetBox>
      </Overlay>
    );
  }

  // Folder graph
  if(type==="folderGraph"){
    const {folder}=payload;
    const series=buildSeries(null,data.cards,folder.id);
    return(
      <Overlay onClose={onClose} sheet>
        <SheetBox title={`Graph — ${folder.name}`} onClose={onClose}>
          <Graph series={series}/>
          <div style={{marginTop:fs}}><Btn full onClick={onClose}>Close</Btn></div>
        </SheetBox>
      </Overlay>
    );
  }

  // Export sheet
  if(type==="exportSheet"){
    const {id,type:et}=payload;
    return(
      <Overlay onClose={onClose} sheet>
        <ExportSheet targetType={et} targetId={id} onClose={onClose}/>
      </Overlay>
    );
  }

  // Move card
  if(type==="moveCard"){
    const {cardId}=payload;
    const currentCard=data.cards.find(c=>c.id===cardId);
    return(
      <Overlay onClose={onClose} sheet>
        <SheetBox title="Move Card" onClose={onClose}>
          {[{id:null,name:"No folder (standalone)"},...data.folders].map(f=>{
            const active=currentCard?.folderId===(f.id??null);
            return(
              <button key={f.id??"none"} onClick={()=>{upd(d=>{const c=d.cards.find(x=>x.id===cardId);if(c)c.folderId=f.id??null});onClose()}}
                style={{display:"block",width:"100%",textAlign:"left",padding:`${fs*0.85}px ${fs}px`,marginBottom:8,borderRadius:12,background:active?T.accentDim:"transparent",border:`1.5px solid ${active?T.accent:C.border}`,color:active?T.accentL:C.textSub,fontSize:fs,cursor:"pointer",boxSizing:"border-box"}}>
                {f.name}{active?" ← current":""}
              </button>
            );
          })}
        </SheetBox>
      </Overlay>
    );
  }

  // Confirm
  if(type==="confirm"){
    const {msg,onYes}=payload;
    return(
      <Overlay onClose={onClose}>
        <ModalBox title="Are you sure?" onClose={onClose}>
          <p style={{fontSize:fs,color:C.textSub,marginBottom:fs*1.4,lineHeight:1.6}}>{msg}</p>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <Btn onClick={onClose}>Cancel</Btn>
            <Btn danger onClick={()=>{onYes();onClose()}}>Delete</Btn>
          </div>
        </ModalBox>
      </Overlay>
    );
  }

  // Add folder/card
  if(type==="addItem"){
    const {itemType}=payload;
    return(
      <Overlay onClose={onClose}>
        <AddItemModal itemType={itemType} onClose={onClose}/>
      </Overlay>
    );
  }

  return null;
}

// Must be inside Ctx
function open_fn(setPopup){
  return (type,payload)=>setPopup({type,payload});
}

// ── Add item modal ─────────────────────────────────────────────────────────
function AddItemModal({itemType,onClose}){
  const {C,T,upd,data}=useA();const fs=useFS();
  const [name,setName]=useState("");
  const [folderId,setFolderId]=useState("");
  function submit(){
    if(!name.trim())return;
    if(itemType==="folder")upd(d=>d.folders.push({id:uid(),name:name.trim(),createdAt:ts()}));
    else upd(d=>d.cards.push({id:uid(),name:name.trim(),folderId:folderId||null,counters:[],stopwatchSessions:[],createdAt:ts()}));
    onClose();
  }
  return(
    <ModalBox title={itemType==="folder"?"New Folder":"New Card"} onClose={onClose}>
      <TInput value={name} onChange={e=>setName(e.target.value)} placeholder={itemType==="folder"?"Folder name…":"Card name…"} autoFocus
        onKeyDown={e=>{if(e.key==="Enter")submit();if(e.key==="Escape")onClose()}}/>
      {itemType==="card"&&data.folders.length>0&&(
        <select value={folderId} onChange={e=>setFolderId(e.target.value)}
          style={{width:"100%",background:C.card,border:`1.5px solid ${C.border}`,borderRadius:10,padding:`${fs*0.7}px ${fs*0.9}px`,color:C.text,fontSize:fs,outline:"none",marginBottom:fs*0.8,boxSizing:"border-box"}}>
          <option value="">No folder</option>
          {data.folders.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
        </select>
      )}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <Btn onClick={onClose}>Cancel</Btn>
        <Btn primary onClick={submit}>Create</Btn>
      </div>
    </ModalBox>
  );
}

// ── Export sheet ───────────────────────────────────────────────────────────
function ExportSheet({targetType,targetId,onClose}){
  const {C,T,data}=useA();const fs=useFS();
  const [range,setRange]=useState("month");
  const [cf,setCf]=useState("");
  const [ct,setCt]=useState("");
  const target=targetType==="folder"?data.folders.find(f=>f.id===targetId):data.cards.find(c=>c.id===targetId);
  const folderName=targetType==="card"?data.folders.find(f=>f.id===target?.folderId)?.name:"";
  function doExport(){
    if(targetType==="folder")exportFolder(target,data.cards,range,cf,ct);
    else exportCard(target,folderName,range,cf,ct);
    onClose();
  }
  const ranges=[["week","Last 7 days"],["month","Last 30 days"],["3months","Last 3 months"],["year","Last year"],["all","All time"],["custom","Custom range"]];
  return(
    <SheetBox title={`Export — ${target?.name}`} onClose={onClose}>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:fs}}>
        {ranges.map(([v,l])=>(
          <button key={v} onClick={()=>setRange(v)}
            style={{padding:`${fs*0.75}px ${fs}px`,borderRadius:10,textAlign:"left",background:range===v?T.accentDim:"transparent",border:`1.5px solid ${range===v?T.accent:C.border}`,color:range===v?T.accentL:C.textSub,fontSize:fs,cursor:"pointer"}}>{l}</button>
        ))}
      </div>
      {range==="custom"&&(
        <div style={{marginBottom:fs,display:"flex",flexDirection:"column",gap:8}}>
          <label style={{fontSize:fs*0.85,color:C.textMuted}}>From</label>
          <input type="date" value={cf} onChange={e=>setCf(e.target.value)} style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:10,padding:`${fs*0.7}px ${fs*0.9}px`,color:C.text,fontSize:fs,outline:"none",width:"100%",boxSizing:"border-box"}}/>
          <label style={{fontSize:fs*0.85,color:C.textMuted}}>To</label>
          <input type="date" value={ct} onChange={e=>setCt(e.target.value)} style={{background:C.card,border:`1.5px solid ${C.border}`,borderRadius:10,padding:`${fs*0.7}px ${fs*0.9}px`,color:C.text,fontSize:fs,outline:"none",width:"100%",boxSizing:"border-box"}}/>
        </div>
      )}
      <Btn primary full onClick={doExport}>Download CSV</Btn>
    </SheetBox>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(()=>loadData());
  const [popup,setPopup]=useState(null);
  const [fabOpen,setFabOpen]=useState(false);
  const [activeTab,setActiveTab]=useState("all");
  const [showSettings,setShowSettings]=useState(false);

  useEffect(()=>saveData(data),[data]);
  useEffect(()=>{document.body.style.background=C.bg;document.body.style.color=C.text},[data.settings]);

  const settings=data.settings||{dark:true,theme:"amber",fontSize:14};
  const C=settings.dark!==false?DARK:LIGHT;
  const T=THEMES[settings.theme]||THEMES.amber;

  function upd(fn){setData(prev=>{const next=JSON.parse(JSON.stringify(prev));if(!next.settings)next.settings={dark:true,theme:"amber",fontSize:14};fn(next);return next})}
  function open(type,payload){setPopup({type,payload})}
  function closePopup(){setPopup(null)}

  const ctx={data,upd,C,T,open,setPopup};

  const tabs=[
    {id:"all",label:"All"},
    ...data.folders.map(f=>({id:f.id,label:f.name,isFolder:true,folder:f})),
    ...(data.cards.some(c=>!c.folderId)&&data.folders.length>0?[{id:"__none__",label:"Other"}]:[]),
  ];

  const visibleCards=activeTab==="all"?data.cards
    :activeTab==="__none__"?data.cards.filter(c=>!c.folderId)
    :data.cards.filter(c=>c.folderId===activeTab);

  const activeFolder=data.folders.find(f=>f.id===activeTab);

  if(showSettings) return <Ctx.Provider value={ctx}><SettingsPage onClose={()=>setShowSettings(false)}/></Ctx.Provider>;

  return(
    <Ctx.Provider value={ctx}>
      <div style={{minHeight:"100vh",background:C.bg,color:C.text,paddingBottom:100,fontSize:settings.fontSize||14}}>

        {/* Header */}
        <div style={{background:C.bg,borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,zIndex:50}}>
          <div style={{padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:9}}>
              <div style={{width:30,height:30,borderRadius:9,background:T.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,color:T.textOnAccent}}>N</div>
              <span style={{fontSize:(settings.fontSize||14)*1.2,fontWeight:700,color:C.text}}>Counter Nest</span>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>open("addItem",{itemType:"folder"})} title="Add Folder"
                style={{width:34,height:34,borderRadius:9,background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{Ico.folder}</button>
              <button onClick={()=>setShowSettings(true)}
                style={{width:34,height:34,borderRadius:9,background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{Ico.settings}</button>
            </div>
          </div>

          {/* Tabs */}
          {tabs.length>1&&(
            <div style={{display:"flex",overflowX:"auto",borderTop:`1px solid ${C.border}`}}>
              {tabs.map(tab=>(
                <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
                  style={{padding:"10px 16px",background:"transparent",border:"none",borderBottom:`2.5px solid ${activeTab===tab.id?T.accent:"transparent"}`,color:activeTab===tab.id?T.accent:C.textMuted,fontSize:(settings.fontSize||14)*0.88,fontWeight:activeTab===tab.id?700:400,cursor:"pointer",whiteSpace:"nowrap",transition:"all 0.15s"}}>
                  {tab.label}
                </button>
              ))}
            </div>
          )}
        </div>

        {/* Folder actions bar (when folder tab active) */}
        {activeFolder&&(
          <div style={{padding:"10px 12px 0",maxWidth:500,margin:"0 auto",display:"flex",gap:8}}>
            <button onClick={()=>open("folderGraph",{folder:activeFolder})}
              style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:8,background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted,fontSize:(settings.fontSize||14)*0.82,cursor:"pointer"}}>
              {Ico.graph}<span>Folder Graph</span>
            </button>
            <button onClick={()=>open("exportSheet",{type:"folder",id:activeFolder.id})}
              style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:8,background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted,fontSize:(settings.fontSize||14)*0.82,cursor:"pointer"}}>
              {Ico.export}<span>Export Folder</span>
            </button>
            <button onClick={()=>open("confirm",{msg:`Delete folder "${activeFolder.name}"? Cards become standalone.`,onYes:()=>{upd(d=>{d.folders=d.folders.filter(f=>f.id!==activeFolder.id);d.cards=d.cards.map(c=>c.folderId===activeFolder.id?{...c,folderId:null}:c)});setActiveTab("all")}})}
              style={{display:"flex",alignItems:"center",gap:4,padding:"6px 10px",borderRadius:8,background:"transparent",border:`1px solid ${C.border}`,color:"#e05a5a",fontSize:(settings.fontSize||14)*0.82,cursor:"pointer",marginLeft:"auto"}}>
              {Ico.trash}
            </button>
          </div>
        )}

        {/* Cards */}
        <div style={{padding:"12px 12px 0",maxWidth:500,margin:"0 auto"}}>
          {visibleCards.length===0&&(
            <div style={{textAlign:"center",padding:"80px 20px"}}>
              <div style={{fontSize:40,marginBottom:16,opacity:0.2}}>⬡</div>
              <p style={{fontSize:(settings.fontSize||14)*1.05,fontWeight:600,color:C.textMuted,marginBottom:8}}>{data.cards.length===0?"Your nest is empty":"Nothing here yet"}</p>
              <p style={{fontSize:(settings.fontSize||14)*0.9,color:C.textFaint,lineHeight:1.7}}>Tap + to add a card</p>
            </div>
          )}
          {visibleCards.map(card=><CardBlock key={card.id} card={card}/>)}
        </div>

        {/* FAB */}
        <div style={{position:"fixed",bottom:28,right:20,zIndex:100,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:12}}>
          {fabOpen&&(
            <div style={{display:"flex",alignItems:"center",gap:10,animation:"fadeUp 0.18s ease both"}}>
              <span style={{fontSize:(settings.fontSize||14)*0.88,fontWeight:500,color:C.text,background:C.surface,padding:"6px 14px",borderRadius:10,border:`1px solid ${C.border}`,whiteSpace:"nowrap",boxShadow:"0 4px 12px rgba(0,0,0,0.25)"}}>Add Card</span>
              <button onClick={()=>{setFabOpen(false);open("addItem",{itemType:"card"})}}
                style={{width:46,height:46,borderRadius:13,background:C.surface,border:`1px solid ${C.border}`,color:C.text,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 12px rgba(0,0,0,0.25)"}}>
                {Ico.plus}
              </button>
            </div>
          )}
          {fabOpen&&<div style={{position:"fixed",inset:0,zIndex:-1}} onClick={()=>setFabOpen(false)}/>}
          <button onClick={()=>setFabOpen(p=>!p)}
            style={{width:56,height:56,borderRadius:17,background:fabOpen?C.surface:T.accent,border:fabOpen?`1px solid ${C.border}`:"none",color:fabOpen?C.text:T.textOnAccent,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 4px 20px ${T.accent}66`,transition:"all 0.2s",transform:fabOpen?"rotate(45deg)":"rotate(0deg)",fontSize:28}}>+</button>
        </div>

        {/* Popups */}
        <PopupLayer popup={popup} onClose={closePopup}/>
      </div>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
