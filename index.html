<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Counter Nest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');

:root {
  --bg: #0f0e0c;
  --card-bg: #1e1a12;
  --border: #2e2618;
  --accent: #d4820a;
  --accent-dim: #a3620a;
  --accent-glow: rgba(212,130,10,0.18);
  --text: #e8e0cc;
  --text-dim: #8a7e68;
  --text-faint: #4a4232;
  --danger: #c0392b;
  --font-size: 14px;
  --btn-size: 38px;
  --radius: 10px;
  --hdr-top-h: 48px;
  --hdr-tabs-h: 40px;
  --hdr-total: 88px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--font-size);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ═══ HEADER ═══ */
#header{
  position:sticky;top:0;z-index:100;
  background:rgba(15,14,12,0.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
#hdr-top{
  height:var(--hdr-top-h);
  display:flex;align-items:center;
  padding:0 10px;gap:6px;
  border-bottom:1px solid var(--border);
}
#app-title{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:1.1rem;color:var(--accent);
  letter-spacing:-0.02em;white-space:nowrap;
  margin-right:6px;flex-shrink:0;
}
#hdr-actions{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.hdr-icon-btn{
  background:none;border:1px solid var(--border);
  color:var(--text-dim);width:34px;height:34px;
  border-radius:8px;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;flex-shrink:0;
}
.hdr-icon-btn:hover{color:var(--accent);border-color:var(--accent)}

#hdr-tabs{
  height:var(--hdr-tabs-h);
  display:flex;align-items:center;
  padding:0 10px;gap:5px;
  overflow-x:auto;scrollbar-width:none;
}
#hdr-tabs::-webkit-scrollbar{display:none}
.tab-btn{
  background:none;border:1px solid transparent;
  color:var(--text-dim);font-family:'DM Mono',monospace;
  font-size:0.78rem;padding:5px 12px;border-radius:6px;
  cursor:pointer;white-space:nowrap;transition:all .18s;flex-shrink:0;
}
.tab-btn:hover{color:var(--text);border-color:var(--border)}
.tab-btn.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}

/* ═══ FOLDER TOOLBAR ═══ */
#folder-toolbar{
  background:rgba(26,22,14,0.9);border-bottom:1px solid var(--border);
  padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;
  position:sticky;top:var(--hdr-total);z-index:99;
}
.folder-tool-btn{
  background:none;border:1px solid var(--border);
  color:var(--text-dim);font-family:'DM Mono',monospace;
  font-size:0.75rem;padding:5px 11px;border-radius:6px;
  cursor:pointer;transition:all .18s;
}
.folder-tool-btn:hover{color:var(--accent);border-color:var(--accent)}
.folder-tool-btn.danger:hover{color:var(--danger);border-color:var(--danger)}

/* ═══ MAIN ═══ */
#main{padding:12px 10px 110px;max-width:720px;margin:0 auto}

/* ═══ CARDS ═══ */
.card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:10px;overflow:hidden;
  transition:border-color .2s;
}
.card:hover{border-color:#3e3220}

.card-header{
  display:flex;align-items:center;gap:6px;
  padding:9px 10px;border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.card.expanded .card-header{border-bottom-color:var(--border)}

.card-name-wrap{flex:1;min-width:0}
.card-name{
  font-family:'Syne',sans-serif;font-weight:600;
  font-size:0.92rem;color:var(--text);
  cursor:pointer;display:inline-block;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:2px 5px;border-radius:4px;border:1px solid transparent;
  transition:border-color .15s;
}
.card-name:hover{border-color:var(--border)}
.card-name-input{
  font-family:'Syne',sans-serif;font-weight:600;font-size:0.92rem;
  background:var(--bg);color:var(--text);border:1px solid var(--accent);
  border-radius:4px;padding:2px 6px;outline:none;width:100%;
}

/* Stopwatch inline label */
.sw-wrap{display:flex;align-items:center;gap:3px;flex-shrink:0}
.sw-label{font-size:0.68rem;color:var(--text-faint);letter-spacing:.02em}
.card-sw-display{
  font-size:0.75rem;color:var(--accent);font-variant-numeric:tabular-nums;
  min-width:50px;text-align:right;
}

.card-hdr-btn{
  background:none;border:none;color:var(--text-dim);
  cursor:pointer;font-size:1rem;padding:5px 6px;
  border-radius:6px;transition:all .15s;flex-shrink:0;
  line-height:1;
}
.card-hdr-btn:hover{color:var(--accent);background:var(--accent-glow)}
.card-hdr-btn.active{color:var(--accent)}
.collapse-btn{font-size:0.7rem;transition:transform .2s}
.card.expanded .collapse-btn{transform:rotate(180deg)}

.card-body{padding:9px 10px 11px}

/* ═══ COUNTERS — Tally-style ═══ */
.counters-list{display:flex;flex-direction:column;gap:6px}

.counter-row{
  display:flex;align-items:center;gap:6px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:6px 8px;
  transition:border-color .15s;
}
.counter-row:hover{border-color:#3e3220}

/* Left: label + value stacked */
.counter-left{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;
}
.counter-label{
  font-size:0.78rem;color:var(--text-dim);
  cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:1px 3px;border-radius:3px;border:1px solid transparent;
  transition:border-color .15s;line-height:1.3;
}
.counter-label:hover{border-color:var(--border)}
.counter-label-input{
  font-family:'DM Mono',monospace;font-size:0.78rem;
  background:var(--bg);color:var(--text);border:1px solid var(--accent);
  border-radius:3px;padding:1px 5px;outline:none;width:100%;
}
.counter-value{
  font-variant-numeric:tabular-nums;font-weight:500;
  font-size:1.25rem;color:var(--text);
  cursor:pointer;padding:0 3px;border-radius:4px;
  border:1px solid transparent;transition:border-color .15s;
  line-height:1.2;display:inline-block;
}
.counter-value:hover{border-color:var(--border)}
.counter-value-input{
  font-family:'DM Mono',monospace;font-size:1.25rem;font-weight:500;
  background:var(--bg);color:var(--text);border:1px solid var(--accent);
  border-radius:4px;padding:0 5px;outline:none;
  width:80px;font-variant-numeric:tabular-nums;
}

/* Right: buttons */
.counter-btns{display:flex;align-items:center;gap:5px;flex-shrink:0}
.counter-ctrl-btn{
  background:var(--card-bg);border:1px solid var(--border);
  color:var(--text);
  width:var(--btn-size);height:var(--btn-size);
  border-radius:8px;cursor:pointer;
  font-size:calc(var(--btn-size) * 0.45);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;font-weight:400;
  -webkit-tap-highlight-color:transparent;
}
.counter-ctrl-btn:hover{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.counter-ctrl-btn:active{transform:scale(0.88)}

.counter-menu-btn{
  background:none;border:none;color:var(--text-faint);
  cursor:pointer;font-size:0.95rem;padding:4px 5px;
  border-radius:5px;transition:all .15s;flex-shrink:0;
}
.counter-menu-btn:hover{color:var(--text-dim);background:var(--border)}

.add-counter-btn{
  width:100%;background:none;border:1px dashed var(--border);
  color:var(--text-faint);font-family:'DM Mono',monospace;
  font-size:0.78rem;padding:8px;border-radius:7px;
  cursor:pointer;margin-top:7px;transition:all .18s;
}
.add-counter-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ═══ DROPDOWN ═══ */
.dropdown{
  position:fixed;z-index:400;
  background:#241f16;border:1px solid var(--border);
  border-radius:8px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.7);
  min-width:165px;
}
.dropdown-item{
  display:block;width:100%;background:none;border:none;
  color:var(--text-dim);font-family:'DM Mono',monospace;
  font-size:0.8rem;padding:10px 14px;text-align:left;
  cursor:pointer;transition:all .12s;
}
.dropdown-item:hover{background:var(--accent-glow);color:var(--text)}
.dropdown-item.danger{color:#e57373}
.dropdown-item.danger:hover{background:rgba(192,57,43,0.15);color:var(--danger)}
.dropdown-sep{height:1px;background:var(--border);margin:2px 0}

/* ═══ FAB ═══ */
#fab{
  position:fixed;bottom:24px;right:16px;z-index:150;
  width:54px;height:54px;border-radius:50%;
  background:var(--accent);border:none;color:#fff;
  font-size:1.7rem;cursor:pointer;display:flex;
  align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(212,130,10,0.5);
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
#fab:hover{background:var(--accent-dim);transform:scale(1.07)}
#fab:active{transform:scale(0.93)}

/* ═══ MODALS ═══ */
.modal-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,0.75);
  display:flex;align-items:center;justify-content:center;
  padding:14px;animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#1a1610;border:1px solid var(--border);
  border-radius:14px;padding:20px 18px;
  width:100%;max-width:460px;
  max-height:92vh;overflow-y:auto;
  animation:slideUp .18s ease;
}
@keyframes slideUp{
  from{transform:translateY(18px);opacity:0}
  to{transform:translateY(0);opacity:1}
}
.modal-title{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:1.05rem;color:var(--accent);margin-bottom:14px;
}
.modal-label{font-size:0.78rem;color:var(--text-dim);margin-bottom:4px;display:block}
.modal-input{
  width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--text);font-family:'DM Mono',monospace;font-size:0.88rem;
  padding:8px 11px;border-radius:7px;outline:none;margin-bottom:12px;
  transition:border-color .15s;
}
.modal-input:focus{border-color:var(--accent)}
.modal-btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.btn-primary{
  background:var(--accent);border:none;color:#fff;
  font-family:'DM Mono',monospace;font-size:0.82rem;
  padding:8px 18px;border-radius:7px;cursor:pointer;transition:all .15s;
}
.btn-primary:hover{background:var(--accent-dim)}
.btn-secondary{
  background:none;border:1px solid var(--border);color:var(--text-dim);
  font-family:'DM Mono',monospace;font-size:0.82rem;
  padding:8px 18px;border-radius:7px;cursor:pointer;transition:all .15s;
}
.btn-secondary:hover{border-color:var(--text-dim);color:var(--text)}
.btn-danger{
  background:none;border:1px solid var(--danger);color:var(--danger);
  font-family:'DM Mono',monospace;font-size:0.82rem;
  padding:8px 18px;border-radius:7px;cursor:pointer;transition:all .15s;
}
.btn-danger:hover{background:rgba(192,57,43,0.15)}

/* ═══ OPTION LIST ═══ */
.option-list{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.option-item{
  display:flex;align-items:center;gap:9px;cursor:pointer;
  padding:7px 11px;border-radius:7px;border:1px solid var(--border);
  font-size:0.8rem;color:var(--text-dim);transition:all .12s;
}
.option-item:hover,.option-item.selected{
  border-color:var(--accent);color:var(--text);background:var(--accent-glow);
}
.option-item input[type=radio]{accent-color:var(--accent)}

/* ═══ SETTINGS ═══ */
#settings-panel{
  display:none;position:fixed;inset:0;z-index:250;
  background:var(--bg);overflow-y:auto;padding:16px;
}
#settings-panel.open{display:block}
.settings-back{
  background:none;border:1px solid var(--border);color:var(--text-dim);
  font-family:'DM Mono',monospace;font-size:0.82rem;
  padding:7px 14px;border-radius:7px;cursor:pointer;
  margin-bottom:18px;transition:all .15s;
}
.settings-back:hover{color:var(--accent);border-color:var(--accent)}
.settings-section-title{
  font-family:'Syne',sans-serif;font-weight:700;font-size:0.82rem;
  color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:8px;margin-top:18px;
}
.settings-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.settings-label{font-size:0.82rem;color:var(--text-dim);min-width:80px}
.settings-slider{flex:1;accent-color:var(--accent)}
.settings-preview{
  font-size:0.8rem;color:var(--text-dim);
  border:1px solid var(--border);border-radius:5px;
  padding:5px 9px;min-width:54px;text-align:center;
}
.theme-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.theme-swatch{
  width:34px;height:34px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:all .15s;
}
.theme-swatch.active{border-color:var(--text);transform:scale(1.15)}

/* ═══ GRAPH ═══ */
.graph-container{position:relative;width:100%;margin-bottom:10px}
.graph-svg{width:100%;display:block}
.graph-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.legend-item{
  display:flex;align-items:center;gap:5px;
  font-size:0.72rem;color:var(--text-dim);
  cursor:pointer;padding:3px 7px;border-radius:4px;
  border:1px solid transparent;transition:all .15s;
}
.legend-item.hidden{opacity:0.3}
.legend-item:hover{border-color:var(--border)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bucket-row{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.bucket-btn{
  background:none;border:1px solid var(--border);
  color:var(--text-dim);font-family:'DM Mono',monospace;
  font-size:0.7rem;padding:3px 8px;border-radius:5px;
  cursor:pointer;transition:all .15s;
}
.bucket-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.graph-tooltip{
  position:absolute;background:#241f16;border:1px solid var(--border);
  border-radius:6px;padding:5px 9px;font-size:0.72rem;
  pointer-events:none;white-space:nowrap;z-index:10;
  box-shadow:0 4px 14px rgba(0,0,0,0.5);
}

/* ═══ HISTORY ═══ */
.history-list{
  max-height:300px;overflow-y:auto;
  border:1px solid var(--border);border-radius:7px;
  background:var(--bg);margin-bottom:10px;
}
.history-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 11px;border-bottom:1px solid var(--border);font-size:0.75rem;
}
.history-item:last-child{border-bottom:none}
.history-action{color:var(--text-dim)}
.history-val{color:var(--accent);font-variant-numeric:tabular-nums}
.history-ts{color:var(--text-faint);font-size:0.68rem}

/* ═══ DATE-TIME RANGE PICKER ═══ */
.range-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:12px}
.range-grid .option-item{font-size:0.76rem;padding:6px 9px}
.datetime-row{display:flex;gap:7px;margin-bottom:10px}
.datetime-row>div{flex:1}
.datetime-row .modal-input{margin-bottom:0}

/* ═══ EMPTY STATE ═══ */
.empty-state{
  text-align:center;padding:60px 20px;
  color:var(--text-faint);font-size:0.85rem;
}
.empty-state .big-icon{font-size:2.5rem;margin-bottom:10px;opacity:.35}

/* ═══ BUMP ═══ */
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.bump{animation:bump .16s ease}
@keyframes flashGreen{0%{background:rgba(39,174,96,0.3)}100%{background:transparent}}
@keyframes flashRed{0%{background:rgba(192,57,43,0.3)}100%{background:transparent}}
.flash-up{animation:flashGreen .35s ease}
.flash-down{animation:flashRed .35s ease}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header id="header">
  <div id="hdr-top">
    <span id="app-title">CounterNest</span>
    <div id="hdr-actions">
      <button class="hdr-icon-btn" id="btn-add-folder" title="Add Folder">⊞</button>
      <button class="hdr-icon-btn" id="btn-settings" title="Settings">⚙</button>
    </div>
  </div>
  <div id="hdr-tabs"></div>
</header>

<!-- ══ FOLDER TOOLBAR ══ -->
<div id="folder-toolbar" style="display:none"></div>

<!-- ══ MAIN ══ -->
<main id="main"></main>

<!-- ══ FAB ══ -->
<button id="fab" title="Add Card">＋</button>

<!-- ══ SETTINGS ══ -->
<div id="settings-panel">
  <div style="max-width:460px;margin:0 auto">
    <button class="settings-back" id="settings-back">← Back</button>
    <div class="modal-title">Settings</div>

    <div class="settings-section-title">Font Size</div>
    <div class="settings-row">
      <span class="settings-label">Text</span>
      <input type="range" class="settings-slider" id="font-slider" min="12" max="28" step="1" value="14">
      <div class="settings-preview" id="font-preview">14px</div>
    </div>

    <div class="settings-section-title">Button Size</div>
    <div class="settings-row">
      <span class="settings-label">± Buttons</span>
      <input type="range" class="settings-slider" id="btn-slider" min="30" max="72" step="2" value="38">
      <div class="settings-preview" id="btn-preview">38px</div>
    </div>

    <div class="settings-section-title">Color Theme</div>
    <div class="theme-swatches" id="theme-swatches"></div>
  </div>
</div>

<!-- ══ MODAL ROOT ══ -->
<div id="modal-root"></div>

<script>
'use strict';

// ════════════════════════════════════════
// DATA
// ════════════════════════════════════════
const LS = 'cnest_v3';
let DB = {
  folders: [],
  cards: [],
  settings: { fontSize: 14, btnSize: 38, theme: 'amber' }
};

function save() { try { localStorage.setItem(LS, JSON.stringify(DB)); } catch(e){} }
function load() {
  try {
    const r = localStorage.getItem(LS);
    if (r) {
      const p = JSON.parse(r);
      DB = { ...DB, ...p };
      DB.cards.forEach(c => {
        if (!c.swSessions) c.swSessions = [];
        if (!c.swState) c.swState = { running:false, startMs:0, elapsed:0 };
        c.counters.forEach(ct => { if (!ct.history) ct.history = []; });
      });
    }
  } catch(e){}
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function ts() { return new Date().toISOString(); }

// ════════════════════════════════════════
// THEMES
// ════════════════════════════════════════
const THEMES = {
  amber:  { accent:'#d4820a', dim:'#a3620a', glow:'rgba(212,130,10,0.18)' },
  blue:   { accent:'#2980b9', dim:'#1f6592', glow:'rgba(41,128,185,0.18)' },
  green:  { accent:'#27ae60', dim:'#1e8449', glow:'rgba(39,174,96,0.18)' },
  purple: { accent:'#8e44ad', dim:'#6c3483', glow:'rgba(142,68,173,0.18)' },
  gray:   { accent:'#7f8c8d', dim:'#5d6d7e', glow:'rgba(127,140,141,0.18)' },
  red:    { accent:'#c0392b', dim:'#922b21', glow:'rgba(192,57,43,0.18)' },
};

const COUNTER_COLORS = [
  '#d4820a','#2980b9','#27ae60','#8e44ad','#c0392b',
  '#16a085','#d35400','#2471a3','#1e8449','#7d3c98'
];

function applyTheme(name) {
  const t = THEMES[name] || THEMES.amber;
  const s = document.documentElement.style;
  s.setProperty('--accent', t.accent);
  s.setProperty('--accent-dim', t.dim);
  s.setProperty('--accent-glow', t.glow);
}

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
function $(id) { return document.getElementById(id); }
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function closeDropdowns() { document.querySelectorAll('.dropdown').forEach(d=>d.remove()); }
function closeModals() { $('modal-root').innerHTML = ''; }

document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown') &&
      !e.target.closest('.card-hdr-btn') &&
      !e.target.closest('.counter-menu-btn')) closeDropdowns();
});

function showDropdown(anchor, items) {
  closeDropdowns();
  const d = el('div','dropdown');
  items.forEach(item => {
    if (item === '-') { d.appendChild(el('div','dropdown-sep')); return; }
    const b = el('button','dropdown-item'+(item.danger?' danger':''), item.label);
    b.onclick = () => { closeDropdowns(); item.action(); };
    d.appendChild(b);
  });
  document.body.appendChild(d);
  const r = anchor.getBoundingClientRect();
  let top = r.bottom + 4, left = r.right - 168;
  if (left < 4) left = 4;
  if (left + 172 > window.innerWidth) left = window.innerWidth - 172;
  if (top + 200 > window.innerHeight) top = r.top - 4 - Math.min(200, items.length*42);
  d.style.cssText = `top:${top}px;left:${left}px`;
}

function showModal(html) {
  closeModals();
  const ov = el('div','modal-overlay');
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.addEventListener('mousedown', e => { if (e.target===ov) closeModals(); });
  $('modal-root').appendChild(ov);
  return ov.querySelector('.modal');
}

function confirmDelete(msg, fn) {
  const m = showModal(`<div class="modal-title">Confirm Delete</div>
    <p style="font-size:.85rem;color:var(--text-dim);margin-bottom:16px">${msg}</p>
    <div class="modal-btn-row">
      <button class="btn-secondary" id="cd-no">Cancel</button>
      <button class="btn-danger" id="cd-yes">Delete</button>
    </div>`);
  m.querySelector('#cd-no').onclick = closeModals;
  m.querySelector('#cd-yes').onclick = () => { closeModals(); fn(); };
}

function padZ(n) { return String(n).padStart(2,'0'); }
function formatElapsed(ms) {
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return h>0 ? `${h}:${padZ(m)}:${padZ(ss)}` : `${padZ(m)}:${padZ(ss)}`;
}
function formatTs(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function formatAxisTime(ms, bucketMs) {
  const d = new Date(ms);
  if (bucketMs < 3600000) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if (bucketMs < 86400000) return d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}

// STATE
// ════════════════════════════════════════
let activeFolder = 'all';
let swTimers = {};

// ════════════════════════════════════════
// RENDER
// ════════════════════════════════════════
function render() { renderTabs(); renderFolderToolbar(); renderCards(); }

function renderTabs() {
  const tabs = $('hdr-tabs');
  tabs.innerHTML = '';
  const items = [{ id:'all', label:'All' }];
  DB.folders.forEach(f => items.push({ id:f.id, label:f.name }));
  if (DB.folders.length>0 && DB.cards.some(c=>!c.folderId)) items.push({ id:'other', label:'Other' });
  items.forEach(t => {
    const b = el('button','tab-btn'+(activeFolder===t.id?' active':''), t.label);
    b.onclick = () => { activeFolder=t.id; render(); };
    tabs.appendChild(b);
  });
}

function renderFolderToolbar() {
  const tb = $('folder-toolbar');
  const folder = DB.folders.find(f=>f.id===activeFolder);
  if (!folder) { tb.style.display='none'; return; }
  tb.style.display='flex'; tb.innerHTML='';
  const bg = el('button','folder-tool-btn','📊 Graph');
  bg.onclick = ()=>showFolderGraph(folder);
  const be = el('button','folder-tool-btn','↓ Export CSV');
  be.onclick = ()=>showExportModal(null,folder.id);
  const bd = el('button','folder-tool-btn danger','✕ Delete Folder');
  bd.onclick = ()=>confirmDelete(`Delete folder "${folder.name}"? Cards become standalone.`,()=>{
    DB.cards.forEach(c=>{ if(c.folderId===folder.id) c.folderId=null; });
    DB.folders=DB.folders.filter(f=>f.id!==folder.id);
    activeFolder='all'; save(); render();
  });
  tb.appendChild(bg); tb.appendChild(be); tb.appendChild(bd);
}

function renderCards() {
  const main = $('main'); main.innerHTML='';
  let cards = DB.cards;
  if (activeFolder==='other') cards=cards.filter(c=>!c.folderId);
  else if (activeFolder!=='all') cards=cards.filter(c=>c.folderId===activeFolder);
  if (!cards.length) {
    const e=el('div','empty-state');
    e.innerHTML='<div class="big-icon">🗂</div><div>No cards yet — tap + to add one</div>';
    main.appendChild(e); return;
  }
  cards.forEach(c=>main.appendChild(buildCard(c)));
}

function buildCard(card) {
  const wrap = el('div','card'+(card.expanded!==false?' expanded':''));
  wrap.dataset.cardId = card.id;

  // Header
  const hdr = el('div','card-header');

  const nameWrap = el('div','card-name-wrap');
  const nameEl = el('span','card-name', card.name);
  nameEl.onclick = ()=>startRenameCard(card,nameEl);
  nameWrap.appendChild(nameEl);
  hdr.appendChild(nameWrap);

  // Stopwatch cluster
  const swWrap = el('div','sw-wrap');
  const swDisp = el('span','card-sw-display');
  swDisp.id = `sw-${card.id}`;
  const elapsed = card.swState.running
    ? card.swState.elapsed + Date.now() - card.swState.startMs
    : card.swState.elapsed;
  swDisp.textContent = elapsed>0 ? formatElapsed(elapsed) : '';
  swWrap.appendChild(swDisp);
  const swBtn = el('button','card-hdr-btn'+(card.swState.running?' active':''), card.swState.running?'⏸':'⏱');
  swBtn.title = 'Stopwatch';
  swBtn.onclick = ()=>toggleSw(card.id);
  swWrap.appendChild(swBtn);
  hdr.appendChild(swWrap);

  // 3-dot menu
  const menuBtn = el('button','card-hdr-btn','⋮');
  menuBtn.onclick = e=>{ e.stopPropagation(); showCardMenu(card,menuBtn); };
  hdr.appendChild(menuBtn);

  // Collapse
  const colBtn = el('button','card-hdr-btn collapse-btn','▼');
  colBtn.onclick = ()=>{ card.expanded=card.expanded===false; save(); render(); };
  hdr.appendChild(colBtn);

  wrap.appendChild(hdr);

  // Body
  if (card.expanded !== false) {
    const body = el('div','card-body');
    const list = el('div','counters-list');
    card.counters.forEach(ct=>list.appendChild(buildCounter(card,ct)));
    const addBtn = el('button','add-counter-btn','+ Add Counter');
    addBtn.onclick = ()=>addCounter(card.id);
    list.appendChild(addBtn);
    body.appendChild(list);
    wrap.appendChild(body);
  }

  if (card.swState.running && !swTimers[card.id]) startSwTimer(card.id);
  return wrap;
}

function buildCounter(card, ct) {
  const row = el('div','counter-row');
  row.dataset.ctId = ct.id;

  // Left: label + value
  const left = el('div','counter-left');
  const lblEl = el('span','counter-label', ct.name);
  lblEl.onclick = ()=>startRenameCounter(card,ct,lblEl);
  left.appendChild(lblEl);
  const valEl = el('span','counter-value', ct.value);
  valEl.onclick = ()=>startEditValue(card,ct,valEl);
  left.appendChild(valEl);
  row.appendChild(left);

  // Buttons
  const btns = el('div','counter-btns');
  const dec = el('button','counter-ctrl-btn','−');
  dec.onclick = ()=>changeCounter(card.id,ct.id,-1,dec,row);
  btns.appendChild(dec);
  const inc = el('button','counter-ctrl-btn','+');
  inc.onclick = ()=>changeCounter(card.id,ct.id,+1,inc,row);
  btns.appendChild(inc);

  // Menu
  const mb = el('button','counter-menu-btn','⋯');
  mb.onclick = e=>{ e.stopPropagation(); showCounterMenu(card,ct,mb); };
  btns.appendChild(mb);

  row.appendChild(btns);
  applyBtnSize(dec); applyBtnSize(inc);
  return row;
}

function applyBtnSize(btn) {
  const sz = DB.settings.btnSize || 38;
  btn.style.width = sz+'px';
  btn.style.height = sz+'px';
  btn.style.fontSize = Math.round(sz*0.44)+'px';
  btn.style.borderRadius = Math.round(sz*0.22)+'px';
}

function changeCounter(cardId, ctId, delta, btn, row) {
  const card=getCard(cardId), ct=getCounter(card,ctId);
  const prev=ct.value; ct.value+=delta;
  ct.history.push({ts:ts(),prev,value:ct.value,action:delta>0?'increment':'decrement',change:delta});
  save();
  const valEl=row.querySelector('.counter-value');
  if(valEl) valEl.textContent=ct.value;
  btn.classList.remove('bump'); void btn.offsetWidth; btn.classList.add('bump');
  row.classList.remove('flash-up','flash-down'); void row.offsetWidth;
  row.classList.add(delta>0?'flash-up':'flash-down');
}

function startEditValue(card, ct, valEl) {
  const inp=el('input','counter-value-input');
  inp.type='number'; inp.value=ct.value;
  valEl.replaceWith(inp); inp.focus(); inp.select();
  const done=()=>{
    const v=parseInt(inp.value);
    if(!isNaN(v)&&v!==ct.value){
      ct.history.push({ts:ts(),prev:ct.value,value:v,action:'manual_set',change:v-ct.value});
      ct.value=v; save();
    }
    const row=inp.closest('.counter-row');
    if(row){ const nv=el('span','counter-value',ct.value); nv.onclick=()=>startEditValue(card,ct,nv); inp.replaceWith(nv); }
  };
  inp.onblur=done;
  inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){inp.value=ct.value;inp.blur();} };
}

function startRenameCounter(card, ct, lblEl) {
  const inp=el('input','counter-label-input'); inp.value=ct.name;
  lblEl.replaceWith(inp); inp.focus(); inp.select();
  const done=()=>{
    ct.name=inp.value.trim()||ct.name; save();
    const nl=el('span','counter-label',ct.name); nl.onclick=()=>startRenameCounter(card,ct,nl);
    inp.replaceWith(nl);
  };
  inp.onblur=done;
  inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){inp.value=ct.name;inp.blur();} };
}

function addCounter(cardId) {

function toggleSw(cardId) {
  const card=getCard(cardId), sw=card.swState;
  if (sw.running) {
    sw.elapsed+=Date.now()-sw.startMs; sw.running=false; sw.startMs=0;
    stopSwTimer(cardId);
    card.swSessions.push({ts:ts(),elapsed:sw.elapsed});
    save(); render();
  } else {
    sw.running=true; sw.startMs=Date.now();
    save(); render(); startSwTimer(cardId);
  }
}
function startSwTimer(cardId) {
  swTimers[cardId]=setInterval(()=>{
    const card=getCard(cardId);
    if(!card||!card.swState.running){stopSwTimer(cardId);return;}
    const d=$(`sw-${cardId}`);
    if(d) d.textContent=formatElapsed(card.swState.elapsed+Date.now()-card.swState.startMs);
  },500);
}
function stopSwTimer(cardId) { clearInterval(swTimers[cardId]); delete swTimers[cardId]; }

// ════════════════════════════════════════
// GRAPH
// ════════════════════════════════════════
const BUCKETS = [
  { label:'1min',  ms:60*1000 },
  { label:'5min',  ms:5*60*1000 },
  { label:'15min', ms:15*60*1000 },
  { label:'30min', ms:30*60*1000 },
  { label:'1hr',   ms:3600*1000 },
  { label:'2hr',   ms:2*3600*1000 },
  { label:'6hr',   ms:6*3600*1000 },
  { label:'daily', ms:24*3600*1000 },
];

function collectSeries(counters) {
  return counters.map((ct,i)=>{
    const pts=ct.history.map(h=>({t:new Date(h.ts).getTime(),v:h.value}));
    if(!pts.length) pts.push({t:Date.now(),v:ct.value});
    pts.sort((a,b)=>a.t-b.t);
    return {id:ct.id,name:ct.name,color:COUNTER_COLORS[i%COUNTER_COLORS.length],points:pts};
  });
}

function bucketize(series, bucketMs) {
  return series.map(s=>{
    if(s.points.length===0) return {...s,points:[]};
    const map={};
    s.points.forEach(p=>{ const k=Math.floor(p.t/bucketMs)*bucketMs; map[k]=p.v; });
    const pts=Object.entries(map).map(([k,v])=>({t:+k,v})).sort((a,b)=>a.t-b.t);
    return {...s,points:pts};
  });
}

function autoBucket(series) {
  const allPts=series.flatMap(s=>s.points);
  if(!allPts.length) return 7;
  const span=Math.max(...allPts.map(p=>p.t))-Math.min(...allPts.map(p=>p.t));
  // pick bucket so we get ~30-80 points
  for(let i=0;i<BUCKETS.length;i++){
    if(span/BUCKETS[i].ms<=80) return i;
  }
  return BUCKETS.length-1;
}

function showCardGraph(card) { showGraph(card.counters,`${card.name} — Graph`); }
function showFolderGraph(folder) {
  const counters=DB.cards.filter(c=>c.folderId===folder.id).flatMap(c=>c.counters);
  showGraph(counters,`${folder.name} — Graph`);
}

function showGraph(counters, title) {
  if(!counters.length){
    showModal(`<div class="modal-title">${title}</div>
      <p style="color:var(--text-faint);font-size:.85rem">No counters to graph.</p>
      <div class="modal-btn-row"><button class="btn-secondary" onclick="closeModals()">Close</button></div>`);
    return;
  }
  const rawSeries=collectSeries(counters);
  let bucketIdx=autoBucket(rawSeries);
  const hidden=new Set();

  const m=showModal(`<div class="modal-title">${title}</div>
    <div class="bucket-row" id="g-buckets"></div>
    <div class="graph-legend" id="g-legend"></div>
    <div class="graph-container" id="g-cont" style="height:220px">
      <svg class="graph-svg" id="g-svg" viewBox="0 0 520 210" preserveAspectRatio="none" style="height:210px"></svg>
      <div class="graph-tooltip" id="g-tip" style="display:none"></div>
    </div>
    <div class="modal-btn-row"><button class="btn-secondary" onclick="closeModals()">Close</button></div>`);

  // Bucket buttons
  const bRow=m.querySelector('#g-buckets');
  BUCKETS.forEach((b,i)=>{
    const btn=el('button','bucket-btn'+(i===bucketIdx?' active':''),b.label);
    btn.onclick=()=>{
      bucketIdx=i;
      bRow.querySelectorAll('.bucket-btn').forEach((x,j)=>x.classList.toggle('active',j===i));
      drawGraph();
    };
    bRow.appendChild(btn);
  });

  // Legend
  const leg=m.querySelector('#g-legend');
  rawSeries.forEach(s=>{
    const item=el('div','legend-item',`<span class="legend-dot" style="background:${s.color}"></span>${s.name}`);
    item.dataset.id=s.id;
    item.onclick=()=>{
      if(hidden.has(s.id))hidden.delete(s.id);else hidden.add(s.id);
      item.classList.toggle('hidden',hidden.has(s.id));
      drawGraph();
    };
    leg.appendChild(item);
  });

  function drawGraph() {
    const svg=m.querySelector('#g-svg');
    const tip=m.querySelector('#g-tip');
    const W=520,H=200,P={t:10,r:12,b:42,l:46};
    const gW=W-P.l-P.r, gH=H-P.t-P.b;

    const series=bucketize(rawSeries,BUCKETS[bucketIdx].ms)
      .filter(s=>!hidden.has(s.id)&&s.points.length>0);

    if(!series.length){
      svg.innerHTML='<text x="260" y="105" text-anchor="middle" fill="#4a4232" font-size="13" font-family="DM Mono,monospace">No data</text>';
      return;
    }

    const allPts=series.flatMap(s=>s.points);
    const tMin=Math.min(...allPts.map(p=>p.t));
    const tMax=Math.max(...allPts.map(p=>p.t));
    const vMin=Math.min(0,...allPts.map(p=>p.v));
    const vMax=Math.max(...allPts.map(p=>p.v));
    const tRange=tMax-tMin||1, vRange=vMax-vMin||1;

    const px=t=>P.l+((t-tMin)/tRange)*gW;
    const py=v=>P.t+gH-((v-vMin)/vRange)*gH;

    let html='';

    // Grid
    for(let i=0;i<=4;i++){
      const y=P.t+i*(gH/4), v=Math.round(vMax-i*(vRange/4));
      html+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#2e2618" stroke-width="1"/>`;
      html+=`<text x="${P.l-5}" y="${y+4}" text-anchor="end" fill="#4a4232" font-size="9" font-family="DM Mono,monospace">${v}</text>`;
    }
    // X labels
    const ticks=Math.min(6,series[0].points.length);
    for(let i=0;i<ticks;i++){
      const t=tMin+(i/(ticks-1||1))*tRange, x=px(t);
      html+=`<text x="${x}" y="${H-4}" text-anchor="middle" fill="#4a4232" font-size="8" font-family="DM Mono,monospace">${formatAxisTime(t,BUCKETS[bucketIdx].ms)}</text>`;
    }

    // Gradients
    html+='<defs>';
    series.forEach(s=>{
      html+=`<linearGradient id="grd-${s.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="${s.color}" stop-opacity="0.02"/>
      </linearGradient>`;
    });
    html+='</defs>';

    // Lines
    series.forEach(s=>{
      if(s.points.length<2) return;
      const pts=s.points.map(p=>[px(p.t),py(p.v)]);
      const path=catmullRom(pts);
      html+=`<path d="${path} L${pts[pts.length-1][0]},${py(vMin)} L${pts[0][0]},${py(vMin)} Z" fill="url(#grd-${s.id})" stroke="none"/>`;
      html+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
    });

    // Dots
    series.forEach(s=>{
      s.points.forEach(p=>{
        const x=px(p.t),y=py(p.v);
        html+=`<circle class="g-dot" cx="${x}" cy="${y}" r="4.5" fill="${s.color}" stroke="var(--bg)" stroke-width="2"
          data-n="${s.name}" data-v="${p.v}" data-t="${new Date(p.t).toLocaleString()}" style="cursor:pointer"/>`;
      });
    });

    svg.innerHTML=html;

    svg.querySelectorAll('.g-dot').forEach(dot=>{
      const show=()=>{
        const cr=m.querySelector('#g-cont').getBoundingClientRect();
        const dr=dot.getBoundingClientRect();
        tip.style.display='block';
        tip.innerHTML=`<b style="color:var(--accent)">${dot.dataset.n}</b><br>${dot.dataset.v} @ ${dot.dataset.t}`;
        let left=dr.left-cr.left+8, top=dr.top-cr.top-46;
        if(left+180>cr.width) left=cr.width-184;
        if(top<0) top=dr.top-cr.top+10;
        tip.style.left=left+'px'; tip.style.top=top+'px';
      };
      dot.addEventListener('mouseenter',show);
      dot.addEventListener('mouseleave',()=>tip.style.display='none');
      dot.addEventListener('touchstart',e=>{e.preventDefault();show();setTimeout(()=>tip.style.display='none',2200);},{passive:false});
    });
  }
  drawGraph();
}

function catmullRom(pts) {
  if(!pts.length) return '';
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;
  }
  return d;
}

// ════════════════════════════════════════
// CSV EXPORT — full time range support
// ════════════════════════════════════════
const EXPORT_RANGES = [
  { label:'Last 5 min',    ms:5*60*1000 },
  { label:'Last 15 min',   ms:15*60*1000 },
  { label:'Last 30 min',   ms:30*60*1000 },
  { label:'Last 1 hour',   ms:3600*1000 },
  { label:'Last 3 hours',  ms:3*3600*1000 },
  { label:'Last 12 hours', ms:12*3600*1000 },
  { label:'Last 24 hours', ms:24*3600*1000 },
  { label:'Last 7 days',   ms:7*86400*1000 },
  { label:'Last 30 days',  ms:30*86400*1000 },
  { label:'Last 3 months', ms:90*86400*1000 },
  { label:'Last 1 year',   ms:365*86400*1000 },
  { label:'All time',      ms:null },
  { label:'Current dataset', ms:'dataset' },
  { label:'Custom range',  ms:'custom' },
];

function showExportModal(cardId, folderId) {
  let sel=11; // default: all time
  let rangeHtml='<div class="range-grid" id="exp-ranges">';
  EXPORT_RANGES.forEach((r,i)=>{
    rangeHtml+=`<label class="option-item${i===sel?' selected':''}">
      <input type="radio" name="er" value="${i}" ${i===sel?'checked':''}>${r.label}
    </label>`;
  });
  rangeHtml+='</div>';

  const m=showModal(`<div class="modal-title">Export CSV</div>
    ${rangeHtml}
    <div id="exp-custom" style="display:none">
      <div class="datetime-row">
        <div><label class="modal-label">From date</label><input type="date" class="modal-input" id="exp-fd"></div>
        <div><label class="modal-label">From time</label><input type="time" class="modal-input" id="exp-ft" value="00:00"></div>
      </div>
      <div class="datetime-row">
        <div><label class="modal-label">To date</label><input type="date" class="modal-input" id="exp-td"></div>
        <div><label class="modal-label">To time</label><input type="time" class="modal-input" id="exp-tt" value="23:59"></div>
      </div>
    </div>
    <div class="modal-btn-row">
      <button class="btn-secondary" id="exp-cancel">Cancel</button>
      <button class="btn-primary" id="exp-ok">↓ Download</button>
    </div>`);

  m.querySelectorAll('.option-item').forEach((item,i)=>{
    item.onclick=()=>{
      m.querySelectorAll('.option-item').forEach(x=>x.classList.remove('selected'));
      item.classList.add('selected');
      item.querySelector('input').checked=true;
      sel=i;
      m.querySelector('#exp-custom').style.display=(EXPORT_RANGES[i].ms==='custom')?'block':'none';
    };
  });

  m.querySelector('#exp-cancel').onclick=closeModals;
  m.querySelector('#exp-ok').onclick=()=>{
    const r=EXPORT_RANGES[sel];
    let fromMs=0, toMs=Date.now();
    if(r.ms==='custom'){
      const fd=m.querySelector('#exp-fd').value, ft=m.querySelector('#exp-ft').value||'00:00';
      const td=m.querySelector('#exp-td').value, tt=m.querySelector('#exp-tt').value||'23:59';
      fromMs=fd?new Date(`${fd}T${ft}`).getTime():0;
      toMs=td?new Date(`${td}T${tt}`).getTime():Date.now();
    } else if(r.ms==='dataset'){
      // find actual data range
      let cards=DB.cards;
      if(cardId) cards=cards.filter(c=>c.id===cardId);
      else if(folderId) cards=cards.filter(c=>c.folderId===folderId);
      const allTs=cards.flatMap(c=>c.counters.flatMap(ct=>ct.history.map(h=>new Date(h.ts).getTime())));
      fromMs=allTs.length?Math.min(...allTs):0;
      toMs=allTs.length?Math.max(...allTs):Date.now();
    } else if(r.ms!==null){
      fromMs=Date.now()-r.ms;
    }
    doExport(cardId,folderId,fromMs,toMs);
    closeModals();
  };
}

function doExport(cardId, folderId, fromMs, toMs) {
  let cards=DB.cards;
  if(cardId) cards=cards.filter(c=>c.id===cardId);
  else if(folderId) cards=cards.filter(c=>c.folderId===folderId);

  let csv='sep=,\n\uFEFFFolder,Card,Counter,Value,Change,Date,Time,Action\n';
  cards.forEach(card=>{
    const fn=card.folderId?(DB.folders.find(f=>f.id===card.folderId)||{name:''}).name:'';
    card.counters.forEach(ct=>{
      ct.history.filter(h=>{
        const t=new Date(h.ts).getTime(); return t>=fromMs&&t<=toMs;
      }).forEach(h=>{
        const d=new Date(h.ts);
        csv+=[`"${fn}"`,`"${card.name}"`,`"${ct.name}"`,h.value,h.change,
          `"${d.toLocaleDateString()}"`,`"${d.toLocaleTimeString()}"`,`"${h.action}"`].join(',')+'\n';
      });
    });
  });

  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='counter-nest-export.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function initSettings() {
  // Font slider
  const fs=$('font-slider'); fs.value=DB.settings.fontSize;
  $('font-preview').textContent=DB.settings.fontSize+'px';
  fs.oninput=()=>{
    const v=+fs.value; DB.settings.fontSize=v;
    document.documentElement.style.setProperty('--font-size',v+'px');
    $('font-preview').textContent=v+'px';
    save();
  };

  // Btn slider
  const bs=$('btn-slider'); bs.value=DB.settings.btnSize;
  $('btn-preview').textContent=DB.settings.btnSize+'px';
  bs.oninput=()=>{
    const v=+bs.value; DB.settings.btnSize=v;
    document.documentElement.style.setProperty('--btn-size',v+'px');
    $('btn-preview').textContent=v+'px';
    save();
    // Update existing buttons without full re-render
    document.querySelectorAll('.counter-ctrl-btn').forEach(b=>applyBtnSize(b));
  };

  // Themes
  const sw=$('theme-swatches');
  Object.entries(THEMES).forEach(([name,t])=>{
    const s=el('div','theme-swatch'+(DB.settings.theme===name?' active':''));
    s.style.background=t.accent; s.title=name;
    s.onclick=()=>{
      DB.settings.theme=name; applyTheme(name);
      sw.querySelectorAll('.theme-swatch').forEach(x=>x.classList.remove('active'));
      s.classList.add('active'); save();
    };
    sw.appendChild(s);
  });

  $('btn-settings').onclick=()=>$('settings-panel').classList.add('open');
  $('settings-back').onclick=()=>$('settings-panel').classList.remove('open');
}

// INIT
// ════════════════════════════════════════
function init() {
  load();
  applyTheme(DB.settings.theme||'amber');
  document.documentElement.style.setProperty('--font-size',(DB.settings.fontSize||14)+'px');
  document.documentElement.style.setProperty('--btn-size',(DB.settings.btnSize||38)+'px');

  $('btn-add-folder').onclick=addFolder;
  $('fab').onclick=()=>{
    const fid=(activeFolder!=='all'&&activeFolder!=='other'&&DB.folders.find(f=>f.id===activeFolder))?activeFolder:null;
    addCard(fid);
  };

  initSettings();
  render();
}

init();
